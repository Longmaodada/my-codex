<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Codex 视觉对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #171521; color: #f5f2ff; font: 14px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 22px; font-size: 24px; }
    h2 { margin: 0 0 10px; font-size: 15px; color: #cabfff; }
    section { margin-bottom: 28px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    figure { margin: 0; padding: 14px; border: 1px solid #3e3853; border-radius: 16px; background: #201d2b; }
    img { display: block; width: 100%; height: 490px; object-fit: contain; border-radius: 10px; background: #eeeae2; }
    .widget img { height: 500px; }
    figcaption { margin-top: 9px; color: #a9a2b9; }
  </style>
</head>
<body>
  <h1>My Codex · Reference / Implementation</h1>
  <section>
    <h2>Dashboard — full view</h2>
    <div class="row">
      <figure><img src="../../references/dashboard.png" alt="Dashboard reference" /><figcaption>Reference · 441 × 394 px</figcaption></figure>
      <figure><img src="dashboard-1280x800.png" alt="Dashboard implementation" /><figcaption>Implementation · 1280 × 800 CSS px · DPR 1</figcaption></figure>
    </div>
  </section>
  <section class="widget">
    <h2>Floating widget — full view</h2>
    <div class="row">
      <figure><img src="../../references/widget.png" alt="Widget reference" /><figcaption>Reference · 200 × 349 px</figcaption></figure>
      <figure><img src="widget-280x430.png" alt="Widget implementation" /><figcaption>Implementation · 280 × 430 CSS px · DPR 1</figcaption></figure>
    </div>
  </section>
</body>
</html>
